name: scan
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Тест (true = прислать тестовое сообщение)'
        default: 'true'
permissions:
  contents: write
concurrency: scanner
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scanner.py ${{ github.event.inputs.test == 'true' && '--test' || '' }}
      - name: save state
        run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m state && git push)
